name: Build do app

# Compila o app, roda os testes e disponibiliza o APK para download
# a cada push ou PR nas branches principais.
on:
  push:
    branches: [ main, homolog ]
  pull_request:
    branches: [ main, homolog ]
  workflow_dispatch: {} # permite rodar manualmente pelo site do GitHub

jobs:
  build:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Permissao de execucao do gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes
        run: ./gradlew test

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: lia-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
